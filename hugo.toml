baseURL = 'https://xbh-ux.github.io/'
title = '我的博客'
theme = 'stack'
defaultContentLanguage = 'zh'

[[module.mounts]]
  source = 'content'
  target = 'content'
  files = ['! Templates/**', '! templates/**', '! assets/**']

[[module.mounts]]
  source = 'content/assets'
  target = 'assets'

[[module.mounts]]
  source = 'content/assets/images'
  target = 'static/images'

[languages]
  [languages.zh]
    locale = 'zh-cn'
    label = '中文'
    weight = 1

[params]
  mainSections = ['posts']
  rssFullContent = true
  favicon = '/favicon.svg'

  [params.sidebar]
    compact = false
    avatar = ''
    subtitle = '记录技术实践、学习笔记与日常思考。'

  [params.article]
    headingAnchor = false
    toc = true
    readingTime = true

  [params.colorScheme]
    toggle = true
    default = 'auto'

  [params.footer]
    since = 2026
    customText = '保持好奇，持续记录。'

[markup.goldmark.renderHooks.image]
  useEmbedded = 'fallback'

[markup.goldmark.renderHooks.link]
  useEmbedded = 'fallback'

[[menu.main]]
  identifier = 'home'
  name = '首页'
  url = '/'
  weight = 10
  [menu.main.params]
    icon = 'home'

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20
  [menu.main.params]
    icon = 'archives'

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 30
  [menu.main.params]
    icon = 'search'
