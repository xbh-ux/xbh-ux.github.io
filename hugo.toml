baseURL = 'https://xbh-ux.github.io/'
title = '我的博客'
theme = 'stack'
defaultContentLanguage = 'zh'

[[module.mounts]]
  source = 'content'
  target = 'content'
  files = ['! Templates/**', '! templates/**', '! assets/**']

[[module.mounts]]
  source = 'content/assets'
  target = 'assets'

[[module.mounts]]
  source = 'content/assets/images'
  target = 'static/images'

[languages]
  [languages.zh]
    locale = 'zh-cn'
    label = '中文'
    weight = 1

[params]
  mainSections = ['posts']
  rssFullContent = true
  favicon = '/favicon.svg'

  [params.sidebar]
    compact = false
    avatar = ''

  [params.article]
    headingAnchor = false
    toc = true
    readingTime = true

  [params.colorScheme]
    toggle = true
    default = 'auto'

  [params.footer]
    since = 2026
    customText = '保持好奇，持续记录。'

[markup.goldmark.renderHooks.image]
  useEmbedded = 'fallback'

[markup.goldmark.renderHooks.link]
  useEmbedded = 'fallback'
